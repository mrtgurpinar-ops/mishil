version: '3.8'

services:
  mishil-db:
    image: postgres:16-alpine
    container_name: mishil-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mishil_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var is required}
      POSTGRES_DB: ${POSTGRES_DB:-mishil_db}
    ports:
      - "5432:5432"
    volumes:
      - mishil_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mishil_user} -d ${POSTGRES_DB:-mishil_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mishil-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mishil-api
    restart: unless-stopped
    depends_on:
      mishil-db:
        condition: service_healthy
    environment:
      - APP_NAME=mishil
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mishil_user}:${POSTGRES_PASSWORD}@mishil-db:5432/${POSTGRES_DB:-mishil_db}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET env var is required}
      - PORT=${PORT:-8080}
      - HOST=0.0.0.0
      - REVENUECAT_WEBHOOK_SECRET=${REVENUECAT_WEBHOOK_SECRET:-}
      - SOUNDS_BASE_URL=${SOUNDS_BASE_URL:-}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mishil_postgres_data:
